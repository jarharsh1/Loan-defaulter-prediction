# Expected schema of the German-credit dataset.
# Data validation checks every incoming file against this contract.

target_column: default

columns:
  checking_balance: object
  months_loan_duration: int64
  credit_history: object
  purpose: object
  amount: int64
  savings_balance: object
  employment_duration: object
  percent_of_income: int64
  years_at_residence: int64
  age: int64
  other_credit: object
  housing: object
  existing_loans_count: int64
  job: object
  dependents: int64
  phone: object
  default: object

numeric_columns:
  - months_loan_duration
  - amount
  - percent_of_income
  - years_at_residence
  - age
  - existing_loans_count
  - dependents

categorical_columns:
  - checking_balance
  - credit_history
  - purpose
  - savings_balance
  - employment_duration
  - other_credit
  - housing
  - job
  - phone
